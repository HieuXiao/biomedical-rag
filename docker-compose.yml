# Neo4j Community Edition (miễn phí) cho Knowledge Graph y khoa.
# Chạy:  docker compose up -d neo4j
# Browser quản trị: http://localhost:7474  (user: neo4j / pass: medicalrag)
# Bolt cho app:     bolt://localhost:7687
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: medrag-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt (driver)
    environment:
      - NEO4J_AUTH=neo4j/medicalrag
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=512M
      - NEO4J_server_memory_pagecache_size=256M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
